openapi: 3.1.0
info:
  title: Система бронювання аудиторій API
  version: 1.0.0
  summary: REST API для управління аудиторіями та їх бронюванням.
  description: |
    Варіант № 2. Виконав: Здоміщук Михайло, група 356-Д.

    **Домовленості:** шляхи від `/api/v1`; ресурси – іменники в множині (kebab-case);
    JSON у camelCase; дати – ISO 8601; колекції – сторінками `{ items, page, pageSize, total }`;
    помилки – `application/problem+json`; автентифікація – `Authorization: Bearer <токен>`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Локальний сервер розробки
tags:
  - name: auth
    description: Автентифікація
  - name: rooms
    description: Управління аудиторіями
  - name: bookings
    description: Управління бронюваннями
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вхід у систему
      x-kss-action: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вхід успішний
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rooms:
    get:
      tags: [rooms]
      operationId: listRooms
      summary: Список аудиторій
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: capacity
          in: query
          description: Мінімальна місткість
          schema:
            type: integer
        - name: hasProjector
          in: query
          description: Наявність проектора
          schema:
            type: boolean
      responses:
        "200":
          description: Сторінка аудиторій
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Створити аудиторію
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomRequest"
      responses:
        "201":
          description: Аудиторію створено
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /rooms/{roomId}:
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Читання аудиторії
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Дані аудиторії
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/bookings:
    get:
      tags: [bookings]
      operationId: listRoomBookings
      summary: Бронювання певної аудиторії
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Сторінка бронювань аудиторії
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings:
    get:
      tags: [bookings]
      operationId: listBookings
      summary: Список усіх бронювань
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Сторінка бронювань
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Створити бронювання
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Бронювання створено
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Читання бронювання
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Дані бронювання
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [bookings]
      operationId: updateBooking
      summary: Оновлення бронювання
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingRequest"
      responses:
        "200":
          description: Бронювання оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [bookings]
      operationId: deleteBooking
      summary: Видалення бронювання
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "204":
          description: Бронювання видалено
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{bookingId}/confirm:
    post:
      tags: [bookings]
      operationId: confirmBooking
      summary: Підтвердження бронювання диспетчером
      x-kss-action: true
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Бронювання успішно підтверджено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /bookings/{bookingId}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Скасування бронювання
      x-kss-action: true
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Бронювання успішно скасовано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен, отриманий через POST /auth/login

  parameters:
    Page:
      name: page
      in: query
      description: Номер сторінки (з 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Кількість елементів на сторінці
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    RoomId:
      name: roomId
      in: path
      required: true
      description: Ідентифікатор аудиторії
      schema:
        type: integer
    BookingId:
      name: bookingId
      in: path
      required: true
      description: Ідентифікатор бронювання
      schema:
        type: integer

  headers:
    Location:
      description: Адреса створеного ресурсу
      schema:
        type: string
        format: uri-reference

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
      example:
        email: dispatcher@college.example.ua
        password: adminpassword

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
      example:
        accessToken: 2f1c9a54-8d3e-4b7a-9f1e-6c2d8a4b0e71
        tokenType: Bearer
        expiresIn: 3600

    Room:
      type: object
      required: [id, name, capacity, hasProjector, createdAt]
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
        hasProjector:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 214
        name: "Аудиторія 214"
        capacity: 30
        hasProjector: true
        createdAt: "2026-10-26T08:00:00Z"

    CreateRoomRequest:
      type: object
      required: [name, capacity, hasProjector]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        capacity:
          type: integer
          minimum: 1
        hasProjector:
          type: boolean
      example:
        name: "Аудиторія 214"
        capacity: 30
        hasProjector: true

    BookingStatus:
      type: string
      enum: [pending, confirmed, cancelled]

    Booking:
      type: object
      required: [id, roomId, userId, startTime, endTime, status, createdAt]
      properties:
        id:
          type: integer
          readOnly: true
        roomId:
          type: integer
        userId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/BookingStatus"
        createdAt:
          type: string
          format: date-time
          readOnly: true
      example:
        id: 1
        roomId: 214
        userId: 5
        startTime: "2026-10-27T10:00:00Z"
        endTime: "2026-10-27T11:20:00Z"
        status: "pending"
        createdAt: "2026-10-26T09:00:00Z"

    CreateBookingRequest:
      type: object
      required: [roomId, startTime, endTime]
      additionalProperties: false
      properties:
        roomId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      example:
        roomId: 214
        startTime: "2026-10-27T10:00:00Z"
        endTime: "2026-10-27T11:20:00Z"

    UpdateBookingRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      example:
        endTime: "2026-10-27T12:00:00Z"

    RoomPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Room"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    BookingPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ProblemDetails:
      type: object
      description: Опис помилки за RFC 9457
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string

  responses:
    BadRequest:
      description: Некоректний запит
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Відсутній або недійсний токен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Недостатньо прав
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: Конфлікт зі станом ресурсу
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationFailed:
      description: Дані не пройшли перевірку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"